<!DOCTYPE html>
<html lang="ja">
    <head>
        <title>position</title>
        <style>
            .parent {
                position: relative;   /* 【父相】给孩子当参考坐标系 */
                width: 200px;
                height: 150px;
                border: 5px solid white;
                box-shadow: 0 0 10px rgba(0,0,0,0.3);
             }

            .child {
                  position: absolute;  /* 【子绝】我要离家出走了，不再乖乖排队 */
                  bottom: 10px;    /* 距离父盒子底部 10px */
                  right:10px;     /* 距离父盒子右边 10px */
  
                  background-color: rgba(0, 0, 0, 0.6); /* 半透明黑色 */
                  color: white;
                  padding: 5px 10px;
                  font-size: 12px;
             }
        </style>
    </head>

    <body>
        <div class="parent">
             <img src="rose.jpeg" width="200" height="150">
             <div class="child">漂亮玫瑰</div>          
        </div>
    </body>
</html>
